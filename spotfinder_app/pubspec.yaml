name: spotfinder_app
description: "Intelligent Smart City Access - Parking System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # HTTP client for talking to the SpotFinder backend
  dio: ^5.4.0

  # Secure storage for JWT token persistence
  flutter_secure_storage: ^9.0.0

  # Simple state management
  provider: ^6.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
