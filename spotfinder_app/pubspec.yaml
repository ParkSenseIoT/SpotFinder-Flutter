name: spotfinder_app
description: "Intelligent Smart City Access - Parking System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  flutter_bloc: ^8.1.6
  equatable: ^2.0.5

  # Dependency injection
  get_it: ^7.7.0

  # HTTP
  dio: ^5.4.3

  # Routing
  go_router: ^14.2.7

  # Secure storage for JWT
  flutter_secure_storage: ^9.2.2

  # Functional types (Either<Failure, Success>)
  dartz: ^0.10.1

  # Date/time formatting
  intl: ^0.19.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
